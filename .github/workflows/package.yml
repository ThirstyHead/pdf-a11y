name: Build Installers & Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG & CLI
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Generate Icon Assets
        run: python packaging/scripts/generate_icons.py

      - name: Build macOS GUI App & DMG
        run: ./packaging/macos/build_dmg.sh

      - name: Build Headless Standalone CLI Binary
        run: pyinstaller --noconfirm packaging/specs/pdf-a11y-cli.spec

      - name: Rename CLI binary for release
        run: |
          mv dist/pdf-a11y dist/pdf-a11y-cli-macos-arm64
          chmod +x dist/pdf-a11y-cli-macos-arm64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            dist/macos/*.dmg
            dist/pdf-a11y-cli-macos-arm64

  build-windows:
    name: Build Windows Installer & CLI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Generate Icon Assets
        run: python packaging/scripts/generate_icons.py

      - name: Build Desktop GUI Directory Bundle
        run: pyinstaller --noconfirm --clean packaging/specs/pdf-a11y-gui.spec

      - name: Build Headless CLI Binary
        run: pyinstaller --noconfirm packaging/specs/pdf-a11y-cli.spec

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/pdf-a11y.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" packaging/windows/pdf-a11y.iss
          } else {
            iscc packaging/windows/pdf-a11y.iss
          }

      - name: Rename CLI binary for release
        shell: pwsh
        run: |
          Move-Item -Path dist\pdf-a11y.exe -Destination dist\pdf-a11y-cli-windows-x86_64.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/windows/*.exe
            dist/pdf-a11y-cli-windows-x86_64.exe

  build-linux:
    name: Build Linux AppImage & CLI
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system Qt & AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 wget file

      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Generate Icon Assets
        run: python packaging/scripts/generate_icons.py

      - name: Build Desktop GUI AppImage
        run: ./packaging/linux/build_appimage.sh

      - name: Build Headless CLI Binary
        run: pyinstaller --noconfirm packaging/specs/pdf-a11y-cli.spec

      - name: Rename CLI binary for release
        run: |
          mv dist/pdf-a11y dist/pdf-a11y-cli-linux-x86_64
          chmod +x dist/pdf-a11y-cli-linux-x86_64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/linux/*.AppImage
            dist/pdf-a11y-cli-linux-x86_64

  release:
    name: Publish Release Assets
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          gh release upload ${{ github.ref_name }} release-assets/* --clobber
